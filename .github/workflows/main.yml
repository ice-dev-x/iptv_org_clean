name: Auto Update M3U Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Run cleaning script
        run: python clean_playlist.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add ecuador.m3u latam.m3u
          # Solo hace commit si hay cambios reales en las listas
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update m3u playlists" && git push)
