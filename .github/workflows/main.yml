name: Auto Update JSON Catalog

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Run cleaning script
        run: python clean_playlist.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          # 1. Agregamos el archivo JSON generado en lugar de los M3U
          git add catalogo.json latam.m3u ecuador.m3u
          
          # 2. Tu misma condición inteligente para subir solo si hay cambios
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update catalogo.json" && git push)